name: Build and Push Docker Image

on:
  push:
    branches:
      - release
      - develop
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ★★★ 第1步：下载 fnos.iso ★★★
      - name: Download fnos.iso
        run: |
          echo "Downloading fnos.iso..."
          ISO_URL="https://iso.liveupdate.fnnas.com/arm/trim/1.1.31/armsr/fnos_Mainland-PE_arm_1.1.31_armsr_1366.iso?sign=35ba09dadd9d68229ee87a4038c14fed&t=1784165528"
          wget --no-check-certificate -O fnos.iso "${ISO_URL}"
          ls -lh fnos.iso
          # 验证文件大小（如果小于 100MB 说明下载失败）
          if [ $(stat -c%s fnos.iso) -lt 100000000 ]; then
            echo "ERROR: fnos.iso download failed or file too small!"
            exit 1
          fi

      # ★★★ 第2步：下载 trim.media.tar.gz ★★★
      - name: Download trim.media.tar.gz
        run: |
          echo "Downloading trim.media.tar.gz..."
          MEDIA_URL="https://github.com/icezxf/fn-d/releases/download/1/trim.media.tar.gz"
          wget --no-check-certificate -O trim.media.tar.gz "${MEDIA_URL}"
          ls -lh trim.media.tar.gz
          # 验证文件大小（如果小于 1MB 说明下载失败）
          if [ $(stat -c%s trim.media.tar.gz) -lt 1000000 ]; then
            echo "ERROR: trim.media.tar.gz download failed or file too small!"
            exit 1
          fi

      # ★★★ 第3步：登录 Docker Hub ★★★
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ★★★ 第4步：设置 QEMU 和 Buildx ★★★
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ★★★ 第5步：提取元数据 ★★★
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # ★★★ 第6步：构建并推送镜像 ★★★
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          # ★★★ 关键：使用 build-args 传递版本信息 ★★★
          build-args: |
            VERSION=${{ github.ref_name }}
